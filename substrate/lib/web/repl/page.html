<!doctype html>
<!-- Lifecycle: experimental.

     The web page of the REPL. lib/web/repl/site.sh copies it into the
     site as index.html.

     The page loads three things:
       program/       the page's own program (repl.sub): the user
                      interface
       session.pack   the compiler program (session.sub), which the page
                      runs in a sandboxed worker. Its files appear to the
                      programs under /session.
       files.pack     the library sources that the user's code can
                      `require`. They appear under /src.

     The page's program gets two host modules: `dom`, to draw on the
     page, and `guest`, to run the compiler program in a worker. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>substrate</title>
<style>
  :root {
    color-scheme: light dark;
    --ground: #fbfaf7; --ink: #1c1b18; --faint: #6b675e; --line: #dedad0; --input: #f1eee6;
    --accent: #2f5d50; --failed: #a3341f;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #171613; --ink: #e9e5da; --faint: #9a9588; --line: #34322c; --input: #211f1b;
            --accent: #8fc7b3; --failed: #f08c74; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  #root { height: 100%; max-width: 54rem; margin: 0 auto; padding: 0 1rem; display: flex; flex-direction: column; }
  header { padding: 1.25rem 0 0.75rem; border-bottom: 1px solid var(--line); }
  h1 { font: 600 1.05rem/1.2 var(--mono); margin: 0; letter-spacing: 0.02em; }
  header p { margin: 0.35rem 0 0.75rem; color: var(--faint); max-width: 44rem; }
  nav { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line);
           border-radius: 4px; padding: 0.2rem 0.7rem; cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { color: var(--faint); border-color: var(--line); cursor: default; opacity: 0.6; }
  button.stop { border-color: var(--failed); color: var(--failed); }
  button.quiet { margin-left: auto; color: var(--faint); }
  main { flex: 1; overflow-y: auto; padding: 0.75rem 0; }
  section.entry { padding: 0.35rem 0 0.35rem 0.75rem; border-left: 2px solid var(--line); margin: 0.5rem 0; }
  section.entry.failed { border-left-color: var(--failed); }
  section.entry.running { border-left-color: var(--accent); animation: running 1.2s ease-in-out infinite; }
  @keyframes running { 50% { border-left-color: var(--line); } }
  @media (prefers-reduced-motion: reduce) { section.entry.running { animation: none; } }
  p.status { margin: 0.5rem 0; color: var(--faint); font-size: 0.9rem; }
  p.problem { color: var(--failed); }
  pre { font: 13.5px/1.5 var(--mono); margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  pre.input { color: var(--accent); }
  pre.output { margin-top: 0.15rem; }
  .failed pre.output { color: var(--failed); }
  footer { display: flex; gap: 0.5rem; align-items: flex-end; padding: 0.75rem 0 1.25rem; border-top: 1px solid var(--line); }
  textarea { flex: 1; font: 13.5px/1.5 var(--mono); color: var(--ink); background: var(--input);
             border: 1px solid var(--line); border-radius: 4px; padding: 0.5rem 0.6rem; resize: vertical; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
</style>
<div id="root"></div>
<script type="module">
import { boot } from './host/web/subhost-web.mjs';
import { dom } from './host/web/dom.mjs';
import { guests } from './host/web/guest.mjs';

window.app = await boot({
  // The page's own program: the directory that `sub build` wrote.
  program: 'program/',
  // Files that the programs can read, kept in memory. Each pack is
  // downloaded and unpacked under the given directory.
  packs: [['files.pack', '/src'], ['session.pack', '/session']],
  // The directory that relative paths start from. An input such as
  // (require ... "lib/substrate/substrate.sub") is found under /src.
  cwd: '/src',
  // The host modules the program may import: `dom` draws into #root,
  // and `guest` runs other programs in workers.
  modules: { dom: dom(document.getElementById('root')), guest: guests() },
});
document.querySelector('textarea')?.focus();
// The browser tests wait for this flag.
window.ready = true;
</script>
</html>
